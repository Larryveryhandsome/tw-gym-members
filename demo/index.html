<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健身房會員關係系統｜通用示範</title>
<style>
:root{--y:#f5b800;--k:#1b1b1b;--bg:#f4f2ec;--card:#fff;--line:#e3dfd4;--mut:#77736a;--ok:#2f8a4f;--warn:#c9761a;--bad:#c23b3b;--lineg:#06c755}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--k)}
header{background:var(--k);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:20}
header .logo{font-weight:800;color:var(--y);font-size:17px;margin-right:6px}
header .sub{color:#bbb;font-size:12px}
.roles{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.roles button,.btn{border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-weight:600}
.roles button{background:#333;color:#ddd}.roles button.on{background:var(--y);color:#000}
.roles .demo{background:var(--lineg);color:#fff}
.notice{background:#fff7d6;border-bottom:1px solid #ecd98a;padding:6px 16px;font-size:12px;color:#6b5a12}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
main,aside{min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--k);color:#fff;border-color:var(--k)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
.btn{background:var(--k);color:#fff}.btn.y{background:var(--y);color:#000}.btn.g{background:var(--lineg)}.btn.ghost{background:#fff;color:var(--k);border:1px solid var(--line)}.btn.red{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.tbl{overflow-x:auto}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;background:#eee}
.t-ok{background:#ddf3e3;color:var(--ok)}.t-warn{background:#fdecd5;color:var(--warn)}.t-bad{background:#fadede;color:var(--bad)}.t-info{background:#e2ebfa;color:#2f5ea8}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:6px;min-width:860px}
.dayh{background:#555;color:#fff;border-radius:8px;text-align:center;padding:4px;font-weight:700}
.cls{border-radius:8px;padding:5px 7px;margin-bottom:5px;cursor:pointer;font-size:12px;line-height:1.3;color:#fff;position:relative}
.cls .t{opacity:.9}.cls .n{font-weight:700;font-size:13px}.cls .c{text-align:right}
.cls.changed{outline:3px solid var(--bad)}.cls.sub{outline:3px solid var(--lineg)}
.cls .badge{position:absolute;top:-6px;right:-4px;background:var(--bad);color:#fff;border-radius:6px;padding:0 5px;font-size:11px}
.cls.sub .badge{background:var(--lineg)}
/* 課程類別顏色由 config.js 的 categories 產生 */
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.step{flex:1 1 150px;border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--mut);background:#fafaf7}
.step.done{border:1px solid var(--ok);color:var(--k);background:#effaf2}.step.now{border:2px solid var(--y);color:var(--k);background:#fffaf0}
.step b{display:block;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
textarea{width:100%}
.mut{color:var(--mut);font-size:12px}
.poster{background:#16384f;color:#fff;border-radius:12px;padding:12px}
.poster h4{margin:0 0 8px;text-align:center;font-size:20px;letter-spacing:4px}
.poster .r{display:flex;gap:8px;align-items:center;background:#fff;color:#222;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px}
/* phone */
.phone{position:sticky;top:64px;background:#111;border-radius:30px;padding:12px;height:calc(100vh - 90px);min-height:560px;max-height:820px;display:flex;flex-direction:column}
@media(max-width:980px){.phone{position:static;height:680px}}
.ph-top{color:#fff;display:flex;align-items:center;gap:6px;padding:4px 6px 8px}
.ph-top select{flex:1;background:#222;color:#fff;border-color:#333}
.chat{flex:1;overflow-y:auto;background:#8aa6d1;border-radius:18px 18px 0 0;padding:10px}
.chat .hd{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;margin-bottom:8px;font-size:13px}
.chat .hd small{display:block;color:var(--lineg);font-weight:600}
.msg{max-width:86%;background:#fff;border-radius:14px;padding:8px 10px;margin:6px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.me{background:#85e27b;margin-left:auto}
.msg .tm{display:block;font-size:10px;color:#888;margin-top:2px}
.msg .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.msg .acts button{flex:1;border:1px solid #06c755;color:#06a347;background:#fff;border-radius:8px;padding:5px;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
.msg .acts button:disabled{opacity:.4}
.rich{background:var(--y);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px}
.rich button{background:#1b1b1b;color:#fff;border:0;border-radius:6px;padding:10px 2px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.ph-in{display:flex;gap:6px;background:#fff;padding:6px;border-radius:0 0 18px 18px}
.ph-in input{flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.log li{margin-bottom:4px}
.hide{display:none!important}
.cta{background:var(--k);color:#fff;border-radius:12px;padding:12px 14px;margin:0 16px 16px;max-width:1368px;margin-inline:auto}
.cta b{color:var(--y)}
dialog{border:0;border-radius:14px;max-width:520px;width:92vw;padding:16px}

/* ===== v2：Apple 式細節＋LINE 圖卡＋流程區塊 ===== */
header{background:rgba(27,27,27,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);border-color:#ece8de}
.kpi{border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.kpi:hover{transform:translateY(-3px)}
.tabs{background:#e9e5da;border-radius:14px;padding:4px;display:inline-flex;gap:2px;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px 14px;transition:background .25s,color .25s,box-shadow .25s}
.tabs button.on{background:#fff;color:var(--k);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view-in{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.btn{transition:transform .2s,filter .2s}.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.08)}
/* 流程：區塊＋箭頭 */
.lane{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px 0;margin:6px 0}
.lane .lb{width:74px;flex:none;font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center}
.lane.old .lb{color:var(--bad)}.lane.new .lb{color:var(--ok)}
.chip{display:flex;align-items:center;gap:6px;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;line-height:1.35;max-width:220px}
.lane.old .chip{background:#f1eee6;color:#6d685d}
.lane.new .chip{background:#e7f6ec;color:#1e6b39}
.lane.new .chip.key{background:#1d1d1f;color:#fff}
.arr{display:flex;align-items:center;padding:0 6px;color:#b9b3a5;font-weight:900}
.lane.new .arr{color:var(--ok)}
.cmp{border-top:1px solid var(--line);padding:12px 0}
.cmp:first-of-type{border-top:0}
.cmp h4{margin:0 0 4px;font-size:14px}
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;margin:10px 0}
.node{display:flex;flex-direction:column;justify-content:center;min-width:112px;border-radius:14px;padding:10px 12px;background:#f4f2ec;color:#8a857a;font-size:12px;border:1px solid transparent;transition:all .4s}
.node b{font-size:13px;color:inherit}
.node .ic{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.7}
.node.done{background:#e7f6ec;color:#1e6b39}
.node.now{background:#fff8e0;color:#6b5200;border-color:var(--y);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,184,0,.55)}70%{box-shadow:0 0 0 10px rgba(245,184,0,0)}100%{box-shadow:0 0 0 0 rgba(245,184,0,0)}}
.link{width:26px;height:2px;background:#d8d3c6;position:relative;margin:0 2px;flex:none}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid #d8d3c6;border-right:0}
.link.done{background:var(--ok)}.link.done::after{border-left-color:var(--ok)}
/* 手機：LINE 圖卡樣式（LINE Flex） */
.chat{background:#9db2d8}
.fx{width:88%;background:#fff;border-radius:18px;overflow:hidden;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.08);font-family:-apple-system,"SF Pro Text","Noto Sans TC",sans-serif}
.fx .fh{background:#FAF9F6;padding:16px 16px 12px}
.fx .br{font-size:10px;font-weight:700;color:#86868B;letter-spacing:.08em}
.fx .kk{font-size:12px;font-weight:700;margin-top:8px}
.fx .tt{font-size:19px;font-weight:700;color:#1D1D1F;margin-top:3px;line-height:1.3}
.fx .fb{padding:14px 16px 16px;font-size:13px;color:#1D1D1F}
.fx .rw{display:flex;gap:10px;padding:3px 0}
.fx .rw .l{flex:2;color:#86868B;font-size:12px}.fx .rw .v{flex:6}
.fx .tx{white-space:pre-wrap;line-height:1.55;padding:2px 0}
.fx .nt{border-top:1px solid #E5E5EA;margin-top:12px;padding-top:10px;font-size:11px;color:#86868B;white-space:pre-wrap}
.fx .ff{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.fx .ff button{border:0;border-radius:10px;padding:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#EFEDE8;color:#1D1D1F;transition:transform .15s}
.fx .ff button.pr{background:#1D1D1F;color:#fff}
.fx .ff button:active{transform:scale(.97)}
.fx .ff button:disabled{opacity:.35;cursor:default}
.fx .tm{display:block;font-size:10px;color:#aaa;padding:0 16px 10px}
.msg,.fx{transform-origin:left bottom}
.msg.me{transform-origin:right bottom}
.pop{animation:pop .5s cubic-bezier(.2,.9,.25,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.cls{transition:transform .25s}.cls:hover{transform:translateY(-2px)}
.cls.changed{animation:pulse 1.6s infinite}
</style>
</head>
<body>
<header>
  <div><div class="logo">會員關係系統</div><div class="sub"><span id="gymName">示範健身房</span>｜管理端・教練端・會員端（LINE）</div></div>
  <div class="roles">
    <button data-role="admin" class="on">管理端</button>
    <button data-role="coach">教練端</button>
    <button class="demo" id="autoDemo">一鍵示範：教練請假 →</button>
    <button id="reset" style="background:#444;color:#ddd">重來</button>
  </div>
</header>
<div class="notice">示範資料說明：團課表、會籍方案都是示範用的範例（可換成貴館自己的）；會員、器材、報修、出席紀錄<b>全部是虛構假資料</b>。所有「發送」都只在這個頁面內模擬，不會真的發出 LINE。</div>

<div class="wrap">
<main>
  <!-- ADMIN -->
  <section id="v-admin">
    <div class="tabs" id="atabs">
      <button data-t="home" class="on">總覽</button><button data-t="sched">團課表</button><button data-t="change">異動與代課</button><button data-t="crm">會員關懷</button><button data-t="equip">器材與報修</button><button data-t="post">公告推播</button><button data-t="log">紀錄</button>
    </div>
    <div id="a-home"></div>
    <div id="a-sched" class="hide"></div>
    <div id="a-change" class="hide"></div>
    <div id="a-crm" class="hide"></div>
    <div id="a-equip" class="hide"></div>
    <div id="a-post" class="hide"></div>
    <div id="a-log" class="hide"></div>
  </section>
  <!-- COACH -->
  <section id="v-coach" class="hide"></section>
</main>

<aside>
  <div class="phone">
    <div class="ph-top">📱<select id="who"></select></div>
    <div class="chat" id="chat"></div>
    <div class="rich" id="rich"></div>
    <div class="ph-in"><input id="say" placeholder="輸入訊息，例如：11月課表"><button class="btn g sm" id="send">送出</button></div>
  </div>
</aside>
</div>
<div class="cta">需要客製化？加 LINE <a href="https://line.me/R/ti/p/@812ibtir" target="_blank" rel="noopener" style="color:var(--y);font-weight:800">@812ibtir</a></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script src="config.js"></script>
<script>
/* ========== 資料（全部來自 config.js 的 GYM_CONFIG，換成自己的健身房只要改那個檔案） ========== */
const CFG=window.GYM_CONFIG;
const GYM=CFG.gymName;
const CAT=Object.fromEntries(Object.entries(CFG.categories).map(([k,v])=>[k,v.name]));
document.head.insertAdjacentHTML('beforeend','<style>'+Object.entries(CFG.categories).map(([k,v])=>`.c-${k}{background:${v.color}${v.text?';color:'+v.text:''}}`).join('')+'</style>');
document.getElementById('gymName').textContent=GYM;
const DAYS=['一','二','三','四','五','六','日'];
const WEEK0=new Date(CFG.weekStart[0],CFG.weekStart[1]-1,CFG.weekStart[2]);
const dstr=d=>{const x=new Date(WEEK0);x.setDate(x.getDate()+d);return `${x.getMonth()+1}/${x.getDate()}（${DAYS[d]}）`};
const RAW=CFG.schedule;
const min=t=>{const[a,b]=t.split(':');return +a*60+ +b};
let S; // 全部狀態
function seed(){
  const courses=RAW.trim().split('\n').map((l,i)=>{const[d,s,e,n,c,cat]=l.split('|');return{id:'C'+(i+1),day:+d,start:s,end:e,name:n,coach:c,orig:c,cat,status:'normal'}});
  // 假會員：固定亂數，可重現
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const sur='陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴周',giv=['小美','阿哲','佳蓉','冠宇','怡君','柏翰','雅婷','俊傑','宜蓁','承恩','思妤','家豪','欣怡','宗翰','品妍','志明','郁婷','建宏','詩涵','育誠'];
  const plans=CFG.plans.memberPlans;const D=CFG.demo;const find=q=>courses.find(c=>c.day===q.day&&c.name===q.name);
  const members=[];
  for(let i=0;i<D.memberCount;i++){
    const fav=[];const n=1+Math.floor(rnd()*3);for(let k=0;k<n;k++)fav.push(courses[Math.floor(rnd()*courses.length)].id);
    const days=Math.floor(Math.pow(rnd(),1.6)*95);
    members.push({id:'M'+String(i+1).padStart(3,'0'),name:sur[i%20]+'○'+giv[(i*7)%20].slice(-1)+'（假）',plan:plans[Math.floor(rnd()*plans.length)],last:days,fav,care:null,expire:Math.floor(rnd()*200)});
  }
  // 示範會員 小美：示範課（預設週五 12:10 哈達瑜珈）的常客
  const fri=find(D.leaveCourse);
  if(!fri)throw new Error('config.js：demo.leaveCourse 在課表裡找不到');
  members[0]={id:'M001',name:'小美（示範會員）',plan:plans[0],last:3,fav:D.memberFavs.map(find).filter(Boolean).map(x=>x.id),care:null,expire:120};
  members[1]={id:'M002',name:'阿明（示範：42 天沒來）',plan:plans[0],last:42,fav:[(find(D.lapsedMemberFav)||courses[0]).id],care:null,expire:65};
  // 讓示範課有一群常客
  for(let i=2;i<2+D.regulars&&i<members.length;i++) if(!members[i].fav.includes(fri.id)) members[i].fav.push(fri.id);
  const equip=CFG.equipment.map(([id,name,area,cycle,since])=>({id,name,area,cycle,since,state:'正常'}));
  S={courses,members,equip,changes:[],repairs:[],posts:[],log:[],inbox:{},quota:{...CFG.lineQuota},approve:true};
  const od=equip.find(e=>e.id===CFG.overdueEquipment);if(od)od.state='保養逾期';
  // 示範角色：請假的老師、前兩位代課人選（依代課規則自動算出）
  const cand=candidates(fri).slice(0,2).map(x=>x.k);
  S.cast={course:fri.id,orig:fri.orig,cand};
}
/* ========== 小工具 ========== */
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let clock=9*60+2;const now=()=>{clock+=1;return `${String(Math.floor(clock/60)).padStart(2,'0')}:${String(clock%60).padStart(2,'0')}`};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function log(t){S.log.unshift(`${now()}　${t}`)}
const ID={member:'M001',m2:'M002',group:'G',};
function who(){return $('#who').value}
function push(to,text,acts){(S.inbox[to]=S.inbox[to]||[]).push({text,acts:acts||null,tm:now(),me:false});if(to!=='G'&&!to.startsWith('coach:')&&!['M001','M002'].includes(to)){/*其他會員只計數*/}S.quota.used+=to==='G'?0:1;if(who()===to)renderPhone()}
function c(id){return S.courses.find(x=>x.id===id)}
const cname=x=>`${dstr(x.day)} ${x.start} ${x.name}`;
function affected(courseId){return S.members.filter(m=>m.fav.includes(courseId))}
function coaches(){return [...new Set(S.courses.map(x=>x.orig))]}
function busy(coach,day,s,e){return S.courses.some(x=>x.coach===coach&&x.day===day&&min(x.start)<min(e)+15&&min(x.end)+15>min(s))}
function subCount(coach){return S.changes.filter(ch=>ch.sub===coach).length}
/* 代課候選：同課名＞同類別；當天前後 15 分鐘沒課；本月代課少的優先 */
function candidates(course){
  return coaches().filter(k=>k!==course.orig).map(k=>{
    const same=S.courses.some(x=>x.orig===k&&x.name===course.name),cat=S.courses.some(x=>x.orig===k&&x.cat===course.cat);
    if(!same&&!cat)return null;
    if(busy(k,course.day,course.start,course.end))return null;
    const score=(same?100:50)-subCount(k)*10;
    return{k,score,why:(same?`有帶「${course.name}」`:`會帶${CAT[course.cat]}類課`)+`；${DAYS[course.day]} ${course.start} 前後沒課`+(subCount(k)?`；本月已代 ${subCount(k)} 堂`:'')};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
}
/* ========== 異動流程（核心） ========== */
function startChange(courseId,type,reason,newStart){
  const x=c(courseId);
  if(S.changes.some(ch=>ch.courseId===courseId&&!['done','cancelled'].includes(ch.status))){toast('這堂課已經在處理異動');return}
  const ch={id:'X'+(S.changes.length+1),courseId,type,reason,newStart,status:'finding',invites:[],sub:null,steps:[now()],notified:0};

function fxHTML(m,w){

  if(head.includes('｜')){[kk,tt]=head.split('｜')}else if(rest.length&&rest[0].length<=26&&!/：/.test(rest[0])){tt=rest[0];rest=rest.slice(1)}
  const rows=[],tx=[];let note='';
  rest.forEach(s=>{const r=s.match(/^([^：\s]{1,6})：(.+)$/);if(/^👉|^（/.test(s))note+=(note?'\n':'')+s;else if(r)rows.push(r);else tx.push(s)});

}
